name: kids-games-local
description: 童趣游戏屋本地 E2E 环境（Vite dev server 隔离端口）

variables:
  # 路径相对 e2e-fusion runner 的 cwd（即 D:\M_X_M\e2e-fusion）
  KIDS_GAMES_ROOT: "../kids-games"
  WEB_PORT: "5180"
  WEB_URL: "http://127.0.0.1:${WEB_PORT}"
  VITE_ENTRY: "${KIDS_GAMES_ROOT}/node_modules/vite/bin/vite.js"
  VITE_CWD: "${KIDS_GAMES_ROOT}"
